# Acting admin panel — deploys standalone alongside your existing project(s).
# Build & run:
#   docker compose up -d --build
# Serves on 127.0.0.1:3100 for local testing, AND on the "acting-shared"
# Docker network as hostname "acting-admin:3100" for the existing fms-caddy
# container to reach (127.0.0.1 doesn't cross container boundaries).
# See deploy/README.md for the one-time network setup.
#
# Uses its own project name so `docker compose down` here can never touch
# your other project's containers, even if run from the same parent dir.
name: acting
services:
  admin:
    container_name: acting-admin
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        # Public Supabase values (safe to embed — anon key is RLS-guarded).
        NEXT_PUBLIC_SUPABASE_URL: "https://pybxdufrmnhgneupsssi.supabase.co"
        NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB5YnhkdWZybW5oZ25ldXBzc3NpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM4MzU0MjMsImV4cCI6MjA5OTQxMTQyM30.GgRA6zHueRJ4yZBGfVJglPMtNkvz52piHHCME8iN-JE"
    # 127.0.0.1-only, purely for `curl` testing from the host. The real
    # traffic path is the shared network below, not this port.
    # Change the host-side "3100" if that port is already taken
    # (check first: `ss -tlnp | grep 3100`).
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - default
      - shared
    restart: unless-stopped

networks:
  shared:
    name: acting-shared
    external: true
