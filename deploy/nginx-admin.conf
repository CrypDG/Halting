# NOT NEEDED on 94.136.189.234 — that server already runs Caddy, so use
# deploy/Caddyfile instead. Keep this file only for a host that runs nginx.
#
# Reverse proxy for the Acting admin panel.
# 1. Put this in /etc/nginx/sites-available/ and symlink into sites-enabled/.
# 2. Get TLS:  sudo certbot --nginx -d acting.loankard.com
#    (certbot rewrites this block to listen on 443 and redirect 80 → 443.)

server {
    listen 80;
    listen [::]:80;
    server_name acting.loankard.com;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
